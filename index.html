<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4;">

    <div style="width: 400px; margin: 50px auto; padding: 20px; background-color: white; border-radius: 10px; box-shadow: 0px 0px 10px gray;">

        <h2 style="text-align: center; color: #333;">Registration Form</h2>

        <form action="https://example.com/register" onsubmit="return validateForm()">

            <label><b>Full Name</b></label><br>
            <input type="text" id="fullname" placeholder="Enter Full Name"
                style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px;"><br>

            <label><b>Email Address</b></label><br>
            <input type="email" id="email" placeholder="Enter Email"
                style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px;"><br>

            <label><b>Password</b></label><br>
            <input type="password" id="password" placeholder="Enter Password"
                style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px;"><br>

            <label><b>Confirm Password</b></label><br>
            <input type="password" id="confirmPassword" placeholder="Confirm Password"
                style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px;"><br>

            <label><b>Age</b></label><br>
            <input type="number" id="age" placeholder="Enter Age"
                style="width:100%; padding:8px; margin-top:5px; margin-bottom:15px;"><br>

            <label>
                <input type="checkbox" id="newsletter">
                Subscribe to Newsletter
            </label>

            <br><br>

            <input type="submit" value="Register"
                style="width:100%; padding:10px; background-color:#28a745; color:white; border:none; border-radius:5px; cursor:pointer;">

        </form>

    </div>

    <script>
        function validateForm() {

            let fullname = document.getElementById("fullname").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
            let age = document.getElementById("age").value;

            if (fullname === "") {
                alert("Full Name cannot be empty.");
                return false;
            }

            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                alert("Please enter a valid email address.");
                return false;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return false;
            }

            if (age < 18 || age > 100) {
                alert("Age must be between 18 and 100.");
                return false;
            }

            alert("Registration Successful!");

            return true;
        }
    </script>

</body>
</html>
